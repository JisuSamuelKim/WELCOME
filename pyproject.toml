[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "welcome-to-the-universe"
version = "0.1.0"
description = "Theory-driven full-sky weak-lensing convergence-map realisations"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Jisu Samuel Kim", email = "jisu.samuel.kim@gmail.com"}
]
license = {text = "MIT"}
keywords = ["cosmology", "weak lensing", "full sky", "HEALPix", "emulator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "healpy>=1.16",
    "camb>=1.5",
    "astropy>=5.3",
    "joblib>=1.3",
]

[project.urls]
Homepage = "https://github.com/JisuSamuelKim/WELCOME"
Repository = "https://github.com/JisuSamuelKim/WELCOME"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
